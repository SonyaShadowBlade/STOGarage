name: Daily off-site Supabase backup

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create database backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL"
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --data-only --use-copy

      - name: Package backup
        run: |
          tar -czf "STO-Supabase-backup-$(date -u +%Y-%m-%d).tar.gz" backup

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: "STO-Supabase-backup-${{ github.run_id }}"
          path: "STO-Supabase-backup-*.tar.gz"
          retention-days: 30
