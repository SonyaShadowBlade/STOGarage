<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Чат с мамой</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f3f5f8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033}.wrap{max-width:720px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e2e7ef;border-radius:18px;box-shadow:0 8px 28px #11182712}.head{padding:16px;border-bottom:1px solid #e7ebf0;display:flex;justify-content:space-between;gap:10px;align-items:center}.title{font-size:22px;font-weight:800}.muted{color:#687386;font-size:13px}.messages{height:62vh;min-height:360px;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}.msg{max-width:78%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}.mine{align-self:flex-end;background:#111827;color:#fff}.theirs{align-self:flex-start;background:#eef1f5}.time{font-size:11px;opacity:.65;margin-top:4px}.compose{display:flex;gap:8px;padding:12px;border-top:1px solid #e7ebf0}.compose textarea{flex:1;min-height:44px;max-height:140px;resize:vertical;border:1px solid #d5dbe5;border-radius:12px;padding:10px;font:inherit}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#eef1f5;color:#172033}.login{padding:28px}.field{display:grid;gap:7px;margin:12px 0}.field input{padding:11px;border:1px solid #d5dbe5;border-radius:11px;font:inherit;width:100%;box-sizing:border-box}.hidden{display:none!important}.status{padding:0 16px 10px;color:#687386;font-size:13px}</style></head><body><div class="wrap"><div class="card"><div class="head"><div><div class="title">💬 Чат</div><div id="who" class="muted">Mama Organizer ↔ STOGarage</div></div><button class="btn secondary" onclick="location.href='./'">Назад</button></div><div id="login" class="login hidden"><h3>Вход в чат</h3><div class="muted">Для чата используется отдельная защищённая сессия. Введи email — на него придёт ссылка для входа.</div><div class="field"><input id="email" type="email" placeholder="Email" autocomplete="email"></div><button class="btn primary" onclick="sendLink()">Отправить ссылку</button><div id="loginStatus" class="status"></div></div><div id="chat" class="hidden"><div id="messages" class="messages"></div><div class="status" id="status"></div><div class="compose"><textarea id="body" placeholder="Написать сообщение..."></textarea><button class="btn primary" onclick="sendMessage()">Отправить</button></div></div></div></div><script>const CHAT_URL='https://lhfzvwlbnfvictowzvmp.supabase.co',CHAT_KEY='sb_publishable_xnF9H_s77aMohEhxmBA_PQ_t8ggXhl0',sb=window.supabase.createClient(CHAT_URL,CHAT_KEY),ROLE='sto',OTHER='mama';let channel=null;const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){$('login').classList.remove('hidden');return;}$('who').textContent=(session.user.email||'')+' · СТО';$('chat').classList.remove('hidden');await load();if(channel)sb.removeChannel(channel);channel=sb.channel('mama-sto-chat').on('postgres_changes',{event:'INSERT',schema:'public',table:'mama_sto_chat_messages'},p=>p.new&&renderMessage(p.new)).subscribe();}async function sendLink(){const email=$('email').value.trim();if(!email)return;const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});$('loginStatus').textContent=error?error.message:'Ссылка для входа отправлена на почту.';}async function load(){const{data,error}=await sb.from('mama_sto_chat_messages').select('*').order('created_at',{ascending:true});if(error){$('status').textContent=error.message;return;}$('messages').innerHTML='';(data||[]).forEach(renderMessage);scrollBottom();}function renderMessage(m){if($('messages').querySelector('[data-id="'+m.id+'"]'))return;const mine=m.sender_role===ROLE,d=new Date(m.created_at),el=document.createElement('div');el.className='msg '+(mine?'mine':'theirs');el.dataset.id=m.id;el.innerHTML='<div>'+esc(m.body)+'</div><div class="time">'+d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</div>';$('messages').appendChild(el);scrollBottom();}function scrollBottom(){const x=$('messages');x.scrollTop=x.scrollHeight;}async function sendMessage(){const body=$('body').value.trim();if(!body)return;const{error}=await sb.from('mama_sto_chat_messages').insert({sender_role:ROLE,recipient_role:OTHER,body});if(error){$('status').textContent=error.message;return;}$('body').value='';}$('body').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});sb.auth.onAuthStateChange(()=>init());init();</script></body></html>
